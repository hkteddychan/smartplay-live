; ============================================================
; SmartPLAY Live — ESP32-CYD (ESP32-2432S028R) 320x240
; 場地放場警報：3 分鐘查 changes-eve.json，15 分鐘查 today.json
; 用法：
;   python -m platformio run -d firmware/esp32_smartplay
;   python -m platformio run -d firmware/esp32_smartplay -t upload --upload-port COM8
;   python -m platformio device monitor -d firmware/esp32_smartplay --port COM8
; ============================================================
[platformio]
src_dir = .
default_envs = esp32-cyd-smartplay

[env:esp32-cyd-smartplay]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
build_flags =
  -D CORE_DEBUG_LEVEL=0
  ; ---- TFT_eSPI：ESP32-2432S028R (CYD) ----
  -D USER_SETUP_LOADED=1
  -D ILI9341_2_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH
  -D SPI_FREQUENCY=55000000
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  ; ---- WiFi ----
  -D WIFI_SSID='"Tidy Home"'
  -D WIFI_PASS='"97470738"'
  ; ---- Push：VM 主動推送放場通知（板子主動出連，唔使 port forward）----
  ; VM 端跑 tools/cyd_push.py；Security Group 要開 TCP 9000
  ; 留空 = 淨係用 1 分鐘 poll（後備路徑）
  -D PUSH_HOST='"13.236.188.205"'
  -D PUSH_PORT=9000
  ; ---- 瀏覽頁 feed：未來 7 日嘅夜晚場次（source patch 合併後先有呢個檔）----
  ; 測試時可用 PLATFORMIO_BUILD_FLAGS 覆蓋去本機 server
  -D FEED_BROWSE='"https://hkteddychan.github.io/smartplay-live/esp32/browse.json"'
  ; ---- 喇叭輸出路徑（見 cyd_audio.h）----
  ;   AUDIO_PATH_AMP     = I2S DAC left  -> GPIO26 (板載擴大機)  ← 用呢個
  ;   AUDIO_PATH_AMP_ALT = I2S DAC right -> GPIO25 (觸控時脈，唔好用)
  ;   AUDIO_PATH_PWM_26  = LEDC PWM      -> GPIO26 (後備，較雜音)
  -D BEEP_PATH=AUDIO_PATH_AMP
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
  bblanchon/ArduinoJson@^7.2.0
