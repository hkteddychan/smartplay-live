; ============================================================
; SOCKS5 PROXY NODE — ESP32-CYD (ESP32-2432S028R)
; 目的：AWS VM 經這台機用住宅 IP 出去
; 用法：cd firmware/esp32_socks5_proxy
;       python -m platformio run -t upload --upload-port COM7
; 測試：python tools/test-socks5.py 192.168.x.x 1080 teddy <pass>
; ============================================================
[platformio]
src_dir = .
default_envs = esp32-cyd-socks

[env:esp32-cyd-socks]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; proxy 不需要 OTA，用大 app 分割區
board_build.partitions = huge_app.csv
build_flags =
  -D CORE_DEBUG_LEVEL=0
  ; ---- TFT_eSPI：狀態顯示（唔用得閒可以加 -D SOCKS_NO_SCREEN=1 收埋）----
  -D USER_SETUP_LOADED=1
  -D ILI9341_2_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH
  -D SPI_FREQUENCY=55000000
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  ; ---- WiFi：寫死自動連（NVS 儲過嗰組其實一樣，呢度做雙保險）----
  -D WIFI_SSID='"REDACTED"'
  -D WIFI_PASS='"REDACTED"'
  ; ---- SOCKS5 RFC 1929 username/password ----
  -D SOCKS_PORT=1080
  -D MAX_SESSIONS=4
  -D SOCKS_USER='"teddy"'
  -D SOCKS_PASS='"pogo-teddy-2026"'
  ; 設 1 就加密碼都唔要（唔建議）
  -D ALLOW_NO_AUTH=0
  ; ---- Reverse relay：ESP32 主動出連 VM（打穿 NAT，唔使 port forward）----
  ; VM_HOST 留空 = 唔開 reverse，淨係 LAN SOCKS
  -D VM_HOST='"13.236.188.205"'
  -D VM_PORT=9000
  -D RELAY_WORKERS=2
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
