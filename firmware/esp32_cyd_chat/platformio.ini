; ============================================================
; AI MATH TUTOR — ESP32-CYD 320x240 (ESP32-2432S028R)
; 架構參考：github.com/kano92-dir/CYD-AI-CHAT (MIT)
; 用法：
;   cd firmware/esp32_cyd_chat
;   python -m platformio run -t upload
;   python -m platformio device monitor
; ============================================================
[platformio]
src_dir = .
default_envs = esp32-cyd-chat

[env:esp32-cyd-chat]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv
build_flags =
  -D CORE_DEBUG_LEVEL=0
  ; ---- TFT_eSPI：ESP32-2432S028R (CYD) ----
  -D USER_SETUP_LOADED=1
  -D ILI9341_2_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH
  -D SPI_FREQUENCY=55000000
  -D SPI_READ_FREQUENCY=20000000
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  ; ---- AI：把 key 貼在下面兩行，或留空跑 DEMO 模式 ----
  -D CHAT_API_KEY='""'
  ; -D CHAT_API_KEY='"sk-or-v1-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"'
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
  bblanchon/ArduinoJson@^7.2.0
