; ============================================================
; NEON SERPENT 3D — ESP32-CYD 240x320 無線控制器
; 用法：cd firmware/esp32_cyd_controller && pio run -t upload
; ============================================================
[platformio]
src_dir = .
default_envs = esp32-cyd

[env:esp32-cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; splash 圖 + 三個函式庫需要較大的 app 分割區
board_build.partitions = min_spiffs.csv
build_flags =
  -D CORE_DEBUG_LEVEL=0
  ; ---- TFT_eSPI：ESP32-2432S028R (CYD) 常見接腳 ----
  -D USER_SETUP_LOADED=1
  -D ILI9341_2_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH
  -D TOUCH_CS=33
  -D SPI_FREQUENCY=55000000
  -D SPI_READ_FREQUENCY=20000000
  -D SPI_TOUCH_FREQUENCY=2500000
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_FONT7=1
  ; ---- 喇叭（板載擴大機）；靜音加 -D HELLO_MELODY_ENABLED=0 ----
  -D SPEAKER_PIN=26
  ; ---- 可選：預先寫死 Wi-Fi（留空則用 AP 設定入口輸入）----
  -D NEON_WIFI_SSID='"你的WiFi名稱"'
  -D NEON_WIFI_PASS='"你的WiFi密碼"'
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  links2004/WebSockets@^2.6.1
  bblanchon/ArduinoJson@^7.2.0
