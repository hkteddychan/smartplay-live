name: Build Android APK

# Builds and unit-tests the PlayFinder Android app on every change that
# touches it. The signed release bundle is produced separately (see
# docs/designs/2026-11-26-playfinder-android-plan.md, Task 14) because it
# needs the upload keystore, which is never committed.

on:
  push:
    branches: [main, playfinder]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: playfinder-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # R8 / resource shrinking is only exercised by a release build. The
      # keystore below is a throwaway generated in the runner: it exists only
      # so the release variant can be compiled and checked.
      - name: Release smoke test (R8 + shrinking)
        run: |
          keytool -genkeypair -v -keystore ci-smoke.jks -alias ci \
            -keyalg RSA -keysize 2048 -validity 1 \
            -storepass ci -keypass ci \
            -dname "CN=CI, O=PlayFinder, C=HK"
          printf 'storeFile=ci-smoke.jks\nstorePassword=ci\nkeyAlias=ci\nkeyPassword=ci\n' > keystore.properties
          ./gradlew --no-daemon bundleRelease
          rm -f keystore.properties ci-smoke.jks

      - name: Upload release bundle (unsigned artifact of the smoke test)
        uses: actions/upload-artifact@v4
        with:
          name: playfinder-release-aab-smoke
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
