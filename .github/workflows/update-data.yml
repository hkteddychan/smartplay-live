name: Deploy Pages

# ⚠️ 數據 mirror 已遷移去 Cloudflare Worker（smartplay-live-mirror，*/15 準時 commit 去 main）
# 呢個 workflow 只負責 Pages deploy：
#   - Worker commit 用 PAT → 會觸發 push event → 呢個 workflow 跑
#   - 淨係 build + deploy Pages artifact，唔 fetch / 唔 commit

on:
  push:
    branches: [main]
  workflow_dispatch:          # 手動觸發

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4