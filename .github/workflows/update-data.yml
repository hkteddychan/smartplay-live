name: SmartPLAY Live Data Mirror (manual fallback)

# ⚠️ Cron 已遷移去 Cloudflare Worker（smartplay-live-mirror，*/15 準時）
# 呢個 workflow 只保留做手動 fallback：
#   - 由 GitHub -> Actions -> Workflows -> 揀呢個 -> Run workflow
# Pages 用 branch-based deploy：push 去 main 會自動 rebuild，唔需要 deploy-pages steps。

on:
  workflow_dispatch:          # 手動觸發

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch SmartPLAY open-data
        run: python3 fetch_data.py

      - name: Check for changes
        id: changes
        run: |
          if git status --porcelain | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit data update
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "🔄 SmartPLAY data mirror (manual) $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push