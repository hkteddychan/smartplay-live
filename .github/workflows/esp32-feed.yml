name: Build ESP32 Feed

# [v2] ESP32 feeds 而家由 Cloudflare Worker inline 生成（同一個 commit 內 data/ + esp32/）。
# 呢個 workflow 淨係做手動 backup — worker 壞咗先 dispatch 用（Actions tab → Build ESP32 Feed → Run workflow）。
# 佢會用 git history diff 重新生成所有 esp32/*.json。

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: esp32-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20   # git history for diff

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate ESP32 compact feeds
        run: python esp32/fetch_esp32.py

      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain esp32/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add esp32/
            git commit -m "🔄 ESP32 feed rebuild (manual backup)"
            git push origin main
          else
            echo "No ESP32 feed change"
          fi
